alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95 > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2.0
    duration: 3m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success_rate
    severity: warning
    condition: tool_success_rate_pct < 90.0
    duration: 5m
    type: symptom-based
    channel: slack
    owner: search-platform
    runbook: docs/alerts.md#alert-3
